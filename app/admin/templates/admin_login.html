{% extends "admin_base.html" %}

{% block title %}Admin-Anmeldung — MacroMic{% endblock %}

{% block admin_head %}
<style>
    .page.login{max-width:480px}
    .login form{display:flex;flex-direction:column;gap:14px}
    .login .btn{width:100%;margin-top:6px}
</style>
{% endblock %}

{% block content %}
<main class="page narrow login">
    <div>
        <h1 class="page-h">Admin-Bereich</h1>
        <p class="page-lede">Anmeldung nur für Administratoren.</p>
    </div>
    {% if error %}
    <p class="notice error" role="alert">{{ error }}</p>
    {% endif %}
    <form method="post" action="/admin/login">
        {{ csrf_field() }}
        <div class="feld">
            <label for="admin-username">Benutzername</label>
            <input type="text" id="admin-username" name="username" autocomplete="username" required>
        </div>
        <div class="feld">
            <label for="admin-password">Passwort</label>
            <input type="password" id="admin-password" name="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn">Anmelden</button>
    </form>
</main>
{% endblock %}
