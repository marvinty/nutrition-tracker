services:
  api:
    build: .
    env_file: .env
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - macromic_data:/data
    # One worker on purpose. Two processes writing the same SQLite file contend for a
    # database-level write lock, which surfaces as intermittent "database is locked"
    # under concurrent logging. At this write volume — a handful of rows per user per
    # day — a single worker is not the bottleneck. Revisit only alongside a move off
    # SQLite.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1
    restart: unless-stopped

  # Keeps app.macromic.de pointed at this connection's IPv4, which isn't static.
  # ddns-updater's Hetzner provider targets the legacy DNS API, which Hetzner retired
  # in the console migration (dns.hetzner.com now redirects, see qdm12/ddns-updater#1039)
  # — this image speaks the new Hetzner Cloud API instead.
  hetzner-ddns:
    image: mbaiti/hetzner-ddns:latest
    environment:
      HETZNER_CLOUD_API_TOKEN: ${HETZNER_CLOUD_API_TOKEN}
      HETZNER_DNS_ZONE_NAME: macromic.de
      HETZNER_DNS_RECORD_NAME: app
      CHECK_INTERVAL_SECONDS: "300"
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    restart: unless-stopped

volumes:
  macromic_data:
  caddy_data:
  caddy_config:
