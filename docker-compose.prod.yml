# Caddy (TLS) and the Hetzner DDNS containers live in their own stack now, shared
# with the other apps on this host: marvinty/homelab-edge, cloned to /root/edge. The
# api publishes no host port — Caddy reaches it over the external `edge` network as
# `macromic-api`, and nothing on the LAN can bypass the proxy (which would let a
# client pick its own X-Forwarded-For and dodge the rate limits).
#
# The network is created once per host, outside Compose: `docker network create edge`.
services:
  api:
    build: .
    env_file: .env
    volumes:
      - macromic_data:/data
    # One worker on purpose. Two processes writing the same SQLite file contend for a
    # database-level write lock, which surfaces as intermittent "database is locked"
    # under concurrent logging. At this write volume — a handful of rows per user per
    # day — a single worker is not the bottleneck. Revisit only alongside a move off
    # SQLite.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1
    networks:
      edge:
        aliases: [macromic-api]
    restart: unless-stopped

networks:
  edge:
    external: true

volumes:
  macromic_data:
